<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IbadanEvents — Discover what's happening around you</title>
<meta name="description" content="Discover events happening around Ibadan, Nigeria — today, this week, and near you.">
<meta name="theme-color" content="#0D0D0D">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IbadanEvents">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
</head>
<body>
<div id="app">

  <!-- SPLASH -->
  <section id="splash-screen" class="screen active">
    <div class="splash-hero">
      <div class="splash-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.6"/></svg>
      </div>
    </div>
    <h1 class="splash-name">IbadanEvents</h1>
    <p class="splash-tagline">Discover what's happening around you</p>
    <div class="splash-dots"><span class="active"></span><span></span><span></span></div>
    <div class="splash-loader"></div>
  </section>

  <!-- HOME: full-screen swipeable event feed -->
  <section id="home-screen" class="screen">
    <div class="feed-topbar">
      <button class="icon-btn glass" id="feed-search-btn" aria-label="Search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      </button>
      <button class="icon-btn glass" id="feed-notify-btn" aria-label="Notifications">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      </button>
    </div>

    <div class="feed-track" id="feed-track"></div>

    <div class="feed-dots" id="feed-dots"></div>
  </section>

  <!-- SEARCH OVERLAY -->
  <div class="search-overlay" id="search-overlay" hidden>
    <div class="search-overlay-header">
      <div class="search-bar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="search" id="search-input" placeholder="Search events, venues, categories…">
      </div>
      <button class="icon-btn" id="search-close-btn" aria-label="Close search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="vlist" id="search-list"></div>
  </div>

  <!-- EVENT DETAIL -->
  <section id="detail-screen" class="screen">
    <div class="detail-banner-wrap">
      <div class="detail-banner" id="detail-banner"></div>
      <button class="detail-back-btn" id="detail-back-btn" aria-label="Back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <button class="detail-share-btn" id="detail-share-btn" aria-label="Share">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 10.5 6.8-3.9M8.6 13.5l6.8 3.9"/></svg>
      </button>
    </div>
    <div class="detail-body">
      <div class="pill-row" id="detail-tags"></div>
      <h1 class="detail-name" id="detail-name"></h1>
      <div class="feed-interested" id="detail-interested-count" hidden>
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="m12 17.3-6.2 3.6 1.6-7L2 9.2l7.1-.6L12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7Z"/></svg>
        <span></span>
      </div>

      <div class="detail-info-row">
        <div class="detail-info-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></div>
        <div class="detail-info-text">
          <div class="detail-info-title" id="detail-date"></div>
          <div class="detail-info-sub" id="detail-time"></div>
        </div>
      </div>

      <div class="detail-info-row">
        <div class="detail-info-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.6"/></svg></div>
        <div class="detail-info-text">
          <div class="detail-info-title" id="detail-venue"></div>
          <div class="detail-info-sub" id="detail-address"></div>
        </div>
      </div>

      <div class="detail-divider"></div>
      <h2 class="detail-section-title">About this event</h2>
      <p class="detail-description" id="detail-description"></p>
    </div>

    <div class="detail-actions">
      <button class="pill-btn outline" id="detail-directions-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l18-8-8 18-2-8-8-2Z"/></svg>
        Get Directions
      </button>
      <button class="pill-btn filled" id="detail-interested-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 17.3-6.2 3.6 1.6-7L2 9.2l7.1-.6L12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7Z"/></svg>
        I'm Interested
      </button>
    </div>
  </section>

  <!-- MAP -->
  <section id="map-screen" class="screen">
    <div class="map-header">
      <button class="icon-btn" id="map-back-btn" aria-label="Back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <div class="map-title">Events near you</div>
    </div>
    <div id="leaflet-map"></div>
    <div class="map-sheet" id="map-sheet" hidden></div>
  </section>

  <!-- SAVED -->
  <section id="saved-screen" class="screen">
    <header class="screen-header">
      <div class="screen-header-title">Saved events</div>
      <div class="screen-header-sub">Events you've marked as interested</div>
    </header>
    <div id="saved-list"></div>
  </section>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav" id="bottom-nav">
    <button class="nav-btn" data-route="home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
      <span>Home</span>
    </button>
    <button class="nav-btn" data-route="map">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 20 3 17V4l6 3 6-3 6 3v13l-6-3-6 3Z"/><path d="M9 7v13M15 4v13"/></svg>
      <span>Map</span>
    </button>
    <button class="nav-btn" data-route="saved">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1Z"/></svg>
      <span>Saved</span>
    </button>
  </nav>

  <div id="toast"></div>
</div>

<template id="event-card-template">
  <article class="event-card">
    <div class="event-card-banner">
      <span class="event-card-badge">Free</span>
      <button type="button" class="event-card-save" aria-label="Save event">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8Z"/></svg>
      </button>
      <button type="button" class="event-card-go" aria-label="View event">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M9 6l6 6-6 6"/></svg>
      </button>
    </div>
    <div class="event-card-body">
      <h3 class="event-card-name"></h3>
      <div class="event-card-meta event-card-datetime">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
        <span></span>
      </div>
      <div class="event-card-meta event-card-venue">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.2"/></svg>
        <span></span>
      </div>
      <div class="event-card-distance"></div>
    </div>
  </article>
</template>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/saved.js"></script>
<script src="/js/cards.js"></script>
<script src="/js/feed.js"></script>
<script src="/js/router.js"></script>
<script src="/js/map.js"></script>
<script src="/js/push.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
